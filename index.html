<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0c181f">
  <meta name="description" content="极速山脊：与五名电脑车手展开三圈街机竞速。支持键盘和手机重力转向。">
  <link rel="icon" href="./icon.svg">
  <title>极速山脊 · Apex Rush</title>
</head>
<body data-phase="ready">
<main id="game">
  <canvas id="track" aria-label="3D 赛车赛道"></canvas>
  <div id="race-ui" inert>
    <button id="pause" class="pause-button" aria-label="暂停比赛" title="暂停 · Esc" disabled><span aria-hidden="true">Ⅱ</span></button>
    <section class="hud" aria-label="比赛数据">
      <div><span class="label">名次</span><strong><b id="position">6</b><em>/6</em></strong></div>
      <div><span class="label">圈数</span><strong><b id="lap">1</b><em>/3</em></strong></div>
      <div class="race-clock"><span class="label">用时</span><strong id="time">00:00.00</strong></div>
    </section>
    <button id="recenter" class="recenter" hidden>回正</button>
    <div class="race-message"><div id="notice" role="status" aria-live="polite"></div><div id="corner-hint" hidden></div></div>
    <div class="driving">
      <div class="nitro"><div class="label"><span id="nitro-label">氮气</span><span class="nitro-key">空格</span></div><div class="nitro-meter" role="meter" aria-label="氮气储量，至少 25% 可用" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100"><i id="nitro"></i></div></div>
      <div class="speed"><b id="speed">0</b><span>km/h</span></div>
    </div>
    <nav class="touch" aria-label="驾驶控制">
      <div class="steering-controls"><button data-key="left" aria-label="左转">◀</button><button data-key="right" aria-label="右转">▶</button></div>
      <div class="pedals"><button data-key="brake">刹车</button><button data-key="gas" class="gas">油门</button><button data-key="boost" class="boost">氮气</button></div>
    </nav>
  </div>
  <div id="countdown" aria-live="assertive"></div>
  <section id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="menu-title">
    <div class="menu-card">
      <div class="brand"><img src="./icon.svg" width="28" height="28" alt=""><span>APEX RUSH</span></div>
      <h1 id="menu-title">极速山脊</h1>
      <p id="intro">海岸环线 · 3 圈 · 6 位车手</p>
      <dl id="results" class="results" hidden><div><dt>名次</dt><dd id="result-position"></dd></div><div><dt>用时</dt><dd id="result-time"></dd></div></dl>
      <button class="primary" id="start">开始比赛 <span aria-hidden="true">↗</span></button>
      <div class="motion-settings">
        <div class="motion-buttons"><button id="motion" type="button" aria-pressed="false">启用重力转向</button><button id="calibrate" type="button" hidden>回正</button></div>
        <p id="motion-status" role="status">倾斜转向，自动油门</p>
      </div>
      <details id="instructions"><summary>操作说明</summary><div class="instructions-body">
        <p class="keyboard-help">方向键 / WASD 驾驶，空格氮气，Esc 暂停。</p>
        <p class="touch-help">按住油门与方向键驾驶；重力模式下倾斜转向，自动油门。</p>
        <p>氮气至少蓄到 25% 可用，点按也会消耗一格。弯前刹车，出弯加速。停稳后按住刹车可倒车。</p>
        <a href="./help.html" target="_blank" rel="noopener">完整指南 ↗</a>
      </div></details>
      <p id="asset-status" class="asset-status" role="status" hidden></p>
    </div>
  </section>
</main>
<script type="module" src="/src/main.js"></script>
</body>
</html>
